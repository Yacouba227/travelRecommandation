<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelBloom - Contactez-nous</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="brand">
      <span class="brand-mark">TB</span>
      TravelBloom
    </div>
    <div class="nav-links">
      <a href="travel_recommendation.html">Accueil</a>
      <a href="about_us.html">À propos de nous</a>
      <a href="contact_us.html">Contactez-nous</a>
    </div>
  </nav>

  <section class="contact-wrap">
    <h1>Contactez-nous</h1>
    <p class="lead">Une question sur une destination ? Écrivez-nous, nous vous répondrons rapidement.</p>

    <form class="contact-form" id="contactForm">
      <label for="name">Nom</label>
      <input type="text" id="name" name="name" placeholder="Votre nom" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="vous@exemple.com" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Votre message..." required></textarea>

      <button type="submit">Soumettre</button>
    </form>
    <p class="form-note" id="formNote"></p>
  </section>

  <script>
    document.getElementById('contactForm').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('formNote').textContent = 'Merci ! Votre message a bien été envoyé.';
      this.reset();
    });
  </script>

</body>
</html>
